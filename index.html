<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İlan Platformu — Hizmet ve Ürün İlanları</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    /* ── Hero ──────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #e0f2fe 0%, #faf9ff 60%, #e0f2fe 100%);
      padding: 3.5rem 1.5rem 2.5rem;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 800;
      color: #1f2937;
      margin-bottom: .75rem;
      line-height: 1.2;
    }
    .hero h1 span { color: var(--renk-birincil); }
    .hero p {
      font-size: 1.1rem;
      color: #6b7280;
      margin-bottom: 2rem;
    }
    .hero-arama {
      display: flex;
      max-width: 560px;
      margin: 0 auto;
      gap: .5rem;
    }
    .hero-arama input {
      flex: 1;
      padding: .8rem 1.25rem;
      border: 2px solid #e5e7eb;
      border-radius: 99px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
      background: #fff;
    }
    .hero-arama input:focus { border-color: var(--renk-birincil); }
    .hero-arama button {
      padding: .8rem 1.75rem;
      background: var(--renk-birincil);
      color: #fff;
      border: none;
      border-radius: 99px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }
    .hero-arama button:hover { background: #0284c7; }

    /* ── Kategoriler ───────────────────────────────────────── */
    .kategoriler-bolum {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 64px;
      z-index: 90;
    }
    .kategoriler-ic {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      gap: .5rem;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .kategoriler-ic::-webkit-scrollbar { display: none; }
    .kategori-btn {
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .875rem 1.125rem;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: .9rem;
      font-weight: 600;
      color: #6b7280;
      white-space: nowrap;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .kategori-btn:hover { color: var(--renk-birincil); }
    .kategori-btn.aktif {
      color: var(--renk-birincil);
      border-bottom-color: var(--renk-birincil);
    }
    .kategori-btn .ikon { font-size: 1.1rem; }

    /* ── Ana içerik ────────────────────────────────────────── */
    .ana-icerik {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* ── Filtre çubuğu ─────────────────────────────────────── */
    .filtre-cubugu {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filtre-cubugu select {
      padding: .5rem .875rem;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: .875rem;
      color: #374151;
      background: #fff;
      cursor: pointer;
      outline: none;
    }
    .filtre-cubugu select:focus { border-color: var(--renk-birincil); }
    .ilan-sayisi {
      margin-left: auto;
      font-size: .875rem;
      color: #6b7280;
      font-weight: 500;
    }

    /* ── Daha fazla yükle ──────────────────────────────────── */
    .daha-fazla-alani {
      text-align: center;
      margin-top: 2.5rem;
    }

    /* ── Mobil ─────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .hero { padding: 2rem 1rem 1.75rem; }
      .hero-arama { flex-direction: column; }
      .hero-arama input,
      .hero-arama button { border-radius: 12px; }
      .ana-icerik { padding: 1.25rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-ic">
      <a href="index.html" class="navbar-logo">🏠 İlan Platformu</a>
      <div class="navbar-arama">
        <span class="arama-ikon">🔍</span>
        <input type="text" id="navbar-arama" placeholder="Hizmet veya ürün ara..." />
      </div>
      <div class="navbar-saglar">
        <a href="ilan-ver.html" class="btn-birincil" style="font-size:.875rem;padding:.5rem 1rem">
          + İlan Ver
        </a>
        <a href="giris.html" class="btn-ikincil" id="nav-giris" style="font-size:.875rem;padding:.5rem 1rem">
          Giriş Yap
        </a>
        <div class="nav-kullanici gizli" id="nav-kullanici">
          <div class="nav-avatar" id="nav-avatar">?</div>
          <span id="nav-kullanici-ad"></span>
          <div class="nav-dropdown" id="nav-dropdown-menu" style="display:none;position:absolute;top:56px;right:1.5rem;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.1);padding:.5rem;min-width:160px;z-index:200;">
            <a href="profil.html" style="display:block;padding:.6rem .875rem;border-radius:8px;color:#374151;font-size:.9rem;text-decoration:none;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='none'">👤 Profilim</a>
            <a href="mesajlar.html" style="display:block;padding:.6rem .875rem;border-radius:8px;color:#374151;font-size:.9rem;text-decoration:none;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='none'">💬 Mesajlarım</a>
            <hr style="border:none;border-top:1px solid #e5e7eb;margin:.25rem 0;" />
            <button id="cikis-btn" style="display:block;width:100%;text-align:left;padding:.6rem .875rem;border-radius:8px;color:#ef4444;font-size:.9rem;background:none;border:none;cursor:pointer;" onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background='none'">🚪 Çıkış Yap</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>İhtiyacın olan <span>hizmeti</span> bul</h1>
    <p>Özel ders, tamir, temizlik ve daha fazlası — yakınındaki uzmanlarla buluş</p>
    <div class="hero-arama">
      <input type="text" id="hero-arama" placeholder="Ne arıyorsun? (örn. matematik özel ders)" />
      <button id="hero-arama-btn">Ara</button>
    </div>
  </section>

  <!-- KATEGORİLER -->
  <div class="kategoriler-bolum">
    <div class="kategoriler-ic" id="kategoriler-listesi">
      <button class="kategori-btn aktif" data-slug="">
        <span class="ikon">🏠</span> Tümü
      </button>
      <!-- JS ile doldurulacak -->
    </div>
  </div>

  <!-- ANA İÇERİK -->
  <main class="ana-icerik">
    <div class="filtre-cubugu">
      <select id="sehir-filtre">
        <option value="">Tüm Şehirler</option>
      </select>
      <select id="sirala-filtre">
        <option value="yeni">En Yeni</option>
        <option value="eski">En Eski</option>
        <option value="ucuz">En Ucuz</option>
        <option value="pahali">En Pahalı</option>
      </select>
      <span class="ilan-sayisi" id="ilan-sayisi"></span>
    </div>

    <div id="ilan-izgarasi" class="ilan-izgarasi">
      <div class="yukleniyor-spinner"></div>
    </div>

    <div class="daha-fazla-alani" id="daha-fazla-alani" style="display:none">
      <button id="daha-fazla-btn" class="btn-ikincil">Daha Fazla Yükle</button>
    </div>
  </main>

  <script type="module">
    import { ilanlariGetir, kategorileriGetir, sehirleriGetir } from './js/ilanlar.js';
    import { navbarGuncelle, cikisYap }                         from './js/auth.js';
    import { ilanKartHTML, bosDurumGoster }                     from './js/ui.js';

    // Durum
    let aktifKategori = '';
    let aktifSehir    = '';
    let aktifArama    = '';
    let aktifSirala   = 'yeni';
    let offset        = 0;
    const LIMIT       = 20;
    let yukleniyor    = false;

    // Navbar
    navbarGuncelle();

    // Dropdown toggle
    const navKullanici = document.getElementById('nav-kullanici');
    const dropdownMenu = document.getElementById('nav-dropdown-menu');
    navKullanici?.addEventListener('click', () => {
      const acik = dropdownMenu.style.display === 'block';
      dropdownMenu.style.display = acik ? 'none' : 'block';
    });
    document.addEventListener('click', (e) => {
      if (!navKullanici?.contains(e.target)) dropdownMenu.style.display = 'none';
    });
    document.getElementById('cikis-btn')?.addEventListener('click', cikisYap);

    // ── Kategorileri yükle ──────────────────────────────────
    async function kategorileriYukle() {
      const kategoriler = await kategorileriGetir();
      const liste = document.getElementById('kategoriler-listesi');
      kategoriler.forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'kategori-btn';
        btn.dataset.slug = k.slug;
        btn.innerHTML = `<span class="ikon">${k.ikon ?? '📋'}</span> ${k.ad}`;
        liste.appendChild(btn);
      });
      liste.querySelectorAll('.kategori-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          liste.querySelectorAll('.kategori-btn').forEach(b => b.classList.remove('aktif'));
          btn.classList.add('aktif');
          aktifKategori = btn.dataset.slug;
          offset = 0;
          ilanlariYukle(true);
        });
      });
    }

    // ── Şehirleri yükle ─────────────────────────────────────
    async function sehirleriYukle() {
      const sehirler = await sehirleriGetir();
      const select = document.getElementById('sehir-filtre');
      sehirler.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        select.appendChild(opt);
      });
    }

    // ── İlanları yükle ──────────────────────────────────────
    async function ilanlariYukle(sifirla = false) {
      if (yukleniyor) return;
      yukleniyor = true;

      const izgara = document.getElementById('ilan-izgarasi');
      if (sifirla) {
        izgara.innerHTML = '<div class="yukleniyor-spinner"></div>';
        offset = 0;
      }

      try {
        const ilanlar = await ilanlariGetir({
          kategoriSlug: aktifKategori || null,
          sehir:        aktifSehir    || null,
          arama:        aktifArama    || null,
          sirala:       aktifSirala,
          limit:        LIMIT,
          offset
        });

        if (sifirla) izgara.innerHTML = '';

        if (ilanlar.length === 0 && sifirla) {
          bosDurumGoster('ilan-izgarasi', {
            ikon: '🔍',
            baslik: 'İlan bulunamadı',
            aciklama: 'Farklı bir arama veya kategori deneyin.',
            btnMetin: 'İlan Ver',
            btnHref: 'ilan-ver.html'
          });
          document.getElementById('ilan-sayisi').textContent = '';
        } else {
          ilanlar.forEach(ilan => {
            izgara.insertAdjacentHTML('beforeend', ilanKartHTML(ilan));
          });
          offset += ilanlar.length;
          const sayiEl = document.getElementById('ilan-sayisi');
          sayiEl.textContent = offset > 0 ? `${offset} ilan gösteriliyor` : '';
          document.getElementById('daha-fazla-alani').style.display =
            ilanlar.length === LIMIT ? 'block' : 'none';
        }
      } catch (e) {
        console.error(e);
        izgara.innerHTML = '<p style="text-align:center;color:#ef4444;padding:2rem">Yüklenirken hata oluştu.</p>';
      } finally {
        yukleniyor = false;
      }
    }

    // ── Arama ────────────────────────────────────────────────
    function aramaYap() {
      aktifArama = document.getElementById('hero-arama').value.trim()
                || document.getElementById('navbar-arama').value.trim();
      offset = 0;
      ilanlariYukle(true);
    }
    document.getElementById('hero-arama-btn').addEventListener('click', aramaYap);
    document.getElementById('hero-arama').addEventListener('keydown', e => { if (e.key === 'Enter') aramaYap(); });
    document.getElementById('navbar-arama').addEventListener('keydown', e => { if (e.key === 'Enter') aramaYap(); });

    // ── Filtreler ────────────────────────────────────────────
    document.getElementById('sehir-filtre').addEventListener('change', e => {
      aktifSehir = e.target.value;
      offset = 0;
      ilanlariYukle(true);
    });
    document.getElementById('sirala-filtre').addEventListener('change', e => {
      aktifSirala = e.target.value;
      offset = 0;
      ilanlariYukle(true);
    });

    // ── Daha fazla ───────────────────────────────────────────
    document.getElementById('daha-fazla-btn').addEventListener('click', () => {
      ilanlariYukle(false);
    });

    // ── Başlat ───────────────────────────────────────────────
    kategorileriYukle();
    sehirleriYukle();
    ilanlariYukle(true);
  </script>
</body>
</html>
