<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; connect-src https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.supabase.co; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş Yap — İlan Platformu</title>
  <link rel="stylesheet" href="/ilan-platformu/css/main.css" />
</head>
<body class="auth-sayfa">

  <div class="auth-kart">
    <a href="/ilan-platformu/index.html" class="auth-logo">🏠 İlan Platformu</a>

    <!-- Sekme -->
    <div class="auth-sekmeler">
      <button class="sekme aktif" data-sekme="giris">Giriş Yap</button>
      <button class="sekme" data-sekme="kayit">Kayıt Ol</button>
    </div>

    <!-- Giriş formu -->
    <div id="giris-formu" class="auth-form">
      <div class="form-grup">
        <label for="giris-email">E-posta</label>
        <input type="email" id="giris-email" placeholder="ornek@mail.com" />
      </div>
      <div class="form-grup">
        <label for="giris-sifre">Şifre</label>
        <input type="password" id="giris-sifre" placeholder="••••••••" />
      </div>
      <button id="giris-btn" class="btn-birincil tam">Giriş Yap</button>
      <button id="sifre-sifirla-btn" class="btn-link">Şifremi unuttum</button>
    </div>

    <!-- Kayıt formu -->
    <div id="kayit-formu" class="auth-form gizli">
      <div class="form-grup">
        <label for="kayit-ad">Ad Soyad</label>
        <input type="text" id="kayit-ad" placeholder="Ad Soyad" />
      </div>
      <div class="form-grup">
        <label for="kayit-email">E-posta</label>
        <input type="email" id="kayit-email" placeholder="ornek@mail.com" />
      </div>
      <div class="form-grup">
        <label for="kayit-telefon">Telefon</label>
        <input type="tel" id="kayit-telefon" placeholder="05XX XXX XX XX" />
      </div>
      <div class="form-grup">
        <label for="kayit-sehir">Şehir</label>
        <input type="text" id="kayit-sehir" placeholder="İstanbul" />
      </div>
      <div class="form-grup">
        <label for="kayit-sifre">Şifre</label>
        <input type="password" id="kayit-sifre" placeholder="En az 6 karakter" />
      </div>
      <button id="kayit-btn" class="btn-birincil tam">Kayıt Ol</button>
    </div>

    <div id="auth-mesaj" class="auth-mesaj gizli"></div>

    <!-- Şifre sıfırlama formu (reset linkten gelince gösterilir) -->
    <div id="sifre-guncelle-formu" class="auth-form gizli">
      <div style="text-align:center;margin-bottom:1.25rem">
        <div style="font-size:2rem;margin-bottom:.5rem">🔒</div>
        <h2 style="font-size:1.1rem;font-weight:700;color:#1f2937">Yeni Şifre Belirle</h2>
        <p style="font-size:.875rem;color:#6b7280;margin-top:.25rem">Lütfen yeni şifrenizi girin.</p>
      </div>
      <div class="form-grup">
        <label for="yeni-sifre">Yeni Şifre</label>
        <input type="password" id="yeni-sifre" placeholder="En az 6 karakter" />
      </div>
      <div class="form-grup">
        <label for="yeni-sifre-tekrar">Şifre Tekrar</label>
        <input type="password" id="yeni-sifre-tekrar" placeholder="Aynı şifreyi tekrar girin" />
      </div>
      <button id="sifre-guncelle-btn" class="btn-birincil tam">Şifremi Güncelle</button>
    </div>
  </div>

  <script type="module">
    import { girisYap, kayitOl, sifreSifirla, sifreGuncelle, mevcutKullanici } from '/ilan-platformu/js/auth.js';
    import { supabase } from '/ilan-platformu/js/config.js';
    import { kayitDogrula, epostaGecerliMi, istemciRateLimit } from '/ilan-platformu/js/validation.js';

    // ── Şifre sıfırlama modu kontrolü ──────────────────────
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        // Sekmeleri gizle, reset formunu göster
        document.querySelector('.auth-sekmeler').style.display = 'none';
        document.getElementById('giris-formu').classList.add('gizli');
        document.getElementById('kayit-formu').classList.add('gizli');
        document.getElementById('sifre-guncelle-formu').classList.remove('gizli');
      } else if (event === 'SIGNED_IN' && !document.getElementById('sifre-guncelle-formu').classList.contains('gizli') === false) {
        // Normal giriş olduysa ve recovery modunda değilsek index'e yönlendir
        window.location.href = '/ilan-platformu/index.html';
      }
    });

    // URL hash'te recovery token varsa formu hemen göster
    if (window.location.hash.includes('type=recovery')) {
      document.querySelector('.auth-sekmeler').style.display = 'none';
      document.getElementById('giris-formu').classList.add('gizli');
      document.getElementById('kayit-formu').classList.add('gizli');
      document.getElementById('sifre-guncelle-formu').classList.remove('gizli');
    }

    // Şifre güncelle butonu
    document.getElementById('sifre-guncelle-btn').addEventListener('click', async () => {
      const yeniSifre      = document.getElementById('yeni-sifre').value;
      const yeniSifreTekrar = document.getElementById('yeni-sifre-tekrar').value;
      if (yeniSifre.length < 6) return mesajGoster('Şifre en az 6 karakter olmalı.', 'hata');
      if (yeniSifre !== yeniSifreTekrar) return mesajGoster('Şifreler eşleşmiyor.', 'hata');
      try {
        const btn = document.getElementById('sifre-guncelle-btn');
        btn.disabled = true; btn.textContent = 'Güncelleniyor...';
        await sifreGuncelle(yeniSifre);
        mesajGoster('Şifreniz güncellendi! Yönlendiriliyorsunuz...', 'basari');
        setTimeout(() => window.location.href = '/ilan-platformu/index.html', 2000);
      } catch(e) {
        mesajGoster(e.message, 'hata');
        document.getElementById('sifre-guncelle-btn').disabled = false;
        document.getElementById('sifre-guncelle-btn').textContent = 'Şifremi Güncelle';
      }
    });

    // Zaten giriş yapmışsa ana sayfaya yönlendir
    // Ama PASSWORD_RECOVERY modunda yönlendirme yapma
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session && !window.location.hash.includes('type=recovery')) {
        window.location.href = '/ilan-platformu/index.html';
      }
    });

    // Sekme geçişi
    document.querySelectorAll('.sekme').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sekme').forEach(b => b.classList.remove('aktif'));
        btn.classList.add('aktif');
        const hedef = btn.dataset.sekme;
        document.getElementById('giris-formu').classList.toggle('gizli', hedef !== 'giris');
        document.getElementById('kayit-formu').classList.toggle('gizli', hedef !== 'kayit');
        mesajTemizle();
      });
    });

    // Giriş
    document.getElementById('giris-btn').addEventListener('click', async () => {
      const email = document.getElementById('giris-email').value.trim();
      const sifre = document.getElementById('giris-sifre').value;
      if (!email || !sifre) return mesajGoster('E-posta ve şifre gerekli.', 'hata');
      if (!epostaGecerliMi(email)) return mesajGoster('Geçerli bir e-posta adresi girin.', 'hata');
      const girisLimit = istemciRateLimit('giris', 10);
      if (!girisLimit.izinli) return mesajGoster(`Lütfen ${girisLimit.kalanSaniye} saniye bekleyin.`, 'hata');
      try {
        yukleniyorAyarla('giris-btn', true);
        await girisYap({ email, sifre });
        window.location.href = '/ilan-platformu/index.html';
      } catch (e) {
        mesajGoster(hataMetni(e), 'hata');
      } finally {
        yukleniyorAyarla('giris-btn', false);
      }
    });

    // Kayıt
    document.getElementById('kayit-btn').addEventListener('click', async () => {
      const adSoyad  = document.getElementById('kayit-ad').value.trim();
      const email    = document.getElementById('kayit-email').value.trim();
      const telefon  = document.getElementById('kayit-telefon').value.trim();
      const sehir    = document.getElementById('kayit-sehir').value.trim();
      const sifre    = document.getElementById('kayit-sifre').value;
      const dogrulama = kayitDogrula({ adSoyad, email, sifre, telefon });
      if (!dogrulama.gecerli) return mesajGoster(dogrulama.hatalar[0], 'hata');
      const kayitLimit = istemciRateLimit('kayit', 30);
      if (!kayitLimit.izinli) return mesajGoster(`Lütfen ${kayitLimit.kalanSaniye} saniye bekleyin.`, 'hata');
      try {
        yukleniyorAyarla('kayit-btn', true);
        await kayitOl({ email, sifre, adSoyad, telefon, sehir });
        mesajGoster('Kaydınız alındı! E-postanızı onaylayın.', 'basari');
      } catch (e) {
        mesajGoster(hataMetni(e), 'hata');
      } finally {
        yukleniyorAyarla('kayit-btn', false);
      }
    });

    // Şifre sıfırlama
    document.getElementById('sifre-sifirla-btn').addEventListener('click', async () => {
      const email = document.getElementById('giris-email').value.trim();
      if (!email) return mesajGoster('Önce e-posta adresinizi girin.', 'hata');
      try {
        await sifreSifirla(email);
        mesajGoster('Şifre sıfırlama bağlantısı gönderildi.', 'basari');
      } catch (e) {
        mesajGoster(hataMetni(e), 'hata');
      }
    });

    function mesajGoster(metin, tip) {
      const el = document.getElementById('auth-mesaj');
      el.textContent = metin;
      el.className = `auth-mesaj ${tip}`;
    }
    function mesajTemizle() {
      document.getElementById('auth-mesaj').className = 'auth-mesaj gizli';
    }
    function yukleniyorAyarla(id, yukleniyor) {
      document.getElementById(id).disabled = yukleniyor;
      document.getElementById(id).textContent = yukleniyor ? 'Lütfen bekleyin...' : (id === 'giris-btn' ? 'Giriş Yap' : 'Kayıt Ol');
    }
    function hataMetni(e) {
      const mesajlar = {
        'Invalid login credentials': 'E-posta veya şifre hatalı.',
        'User already registered': 'Bu e-posta adresi zaten kayıtlı.',
        'Password should be at least 6 characters': 'Şifre en az 6 karakter olmalı.',
        'Email not confirmed': 'E-posta adresinizi henüz onaylamadınız.'
      };
      return mesajlar[e.message] ?? e.message;
    }
  </script>
</body>
</html>
